<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Celulares</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f0f13;
  --card:     #1c1c24;
  --card-h:   #23232d;
  --border:   #2a2a38;
  --text:     #ececf4;
  --sub:      #8888a8;
  --dim:      #55556a;
  --realme:   #ffd200;
  --xiaomi:   #ff6600;
  --motorola: #1557ff;
  --itel:     #00c48c;
  --amazon:   #FF9900;
}

body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 0; }

/* HEADER */
header { margin: 0; padding: 0; line-height: 0; }
.eyebrow { font-size: .65rem; letter-spacing: .28em; text-transform: uppercase; color: var(--dim); margin-bottom: .7rem; }
header h1 { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 800; letter-spacing: -.025em; }
.hline { width: 40px; height: 2px; background: var(--border); margin: 1.1rem auto 0; }

/* BRAND SECTION */
.brand-section { margin-bottom: 3.5rem; }
.brand-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
.brand-label { font-family: 'Syne', sans-serif; font-size: .68rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; padding: .28rem .75rem; border-radius: 4px; color: #000; flex-shrink: 0; }
.brand-label.realme   { background: var(--realme); }
.brand-label.xiaomi   { background: var(--xiaomi); color: #fff; }
.brand-label.motorola { background: var(--motorola); color: #fff; }
.brand-label.itel     { background: var(--itel); }
.brand-rule { flex: 1; height: 1px; background: var(--border); }

/* CARD GRID */
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }

/* CARD */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s, border-color .15s; position: relative; aspect-ratio: 2/3; }
.card:hover { transform: translateY(-4px); border-color: #3a3a50; box-shadow: 0 14px 40px rgba(0,0,0,.55); }
.card:active { transform: translateY(-2px); }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; opacity: 0; transition: opacity .2s; z-index: 10; }
.card:hover::before { opacity: 1; }
.realme   .card::before { background: var(--realme); }
.xiaomi   .card::before { background: var(--xiaomi); }
.motorola .card::before { background: var(--motorola); }
.itel     .card::before { background: var(--itel); }

/* CARD IMAGE + SLIDER */
.card-img { width: 100%; flex: 1; background: #13131a; overflow: hidden; position: relative; min-height: 0; }
.cslider { position: relative; width: 100%; height: 100%; }
.cslide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .55s ease; pointer-events: none; }
.cslide.active { opacity: 1; pointer-events: auto; }
.cslide img { max-height: 86%; max-width: 88%; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 6px 16px rgba(0,0,0,.6)); transition: transform .3s; display: block; }
.card:hover .cslide.active img { transform: scale(1.06) translateY(-2px); }
.csdots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 6; }
.csdot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background .2s, transform .2s; cursor: pointer; border: none; padding: 0; }
.csdot.active { background: rgba(255,255,255,.85); transform: scale(1.25); }
.card-stripe { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; }
.realme   .card-stripe { background: var(--realme); }
.xiaomi   .card-stripe { background: var(--xiaomi); }
.motorola .card-stripe { background: var(--motorola); }
.itel     .card-stripe { background: var(--itel); }

.card-info { padding: .6rem 1.2rem .7rem; display: flex; flex-direction: column; gap: .35rem; flex-shrink: 0; }
.card-model { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
.card-tags { display: flex; gap: .4rem; flex-wrap: wrap; }
.ctag { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: .2rem .55rem; border-radius: 4px; background: rgba(255,255,255,.07); color: var(--sub); }
.ctag.stor { background: rgba(255,255,255,.11); color: #cccce0; }
.card-dots { display: flex; gap: .35rem; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.14); flex-shrink: 0; }
.d-preto   { background: #1a1a1a; border-color: #555; }
.d-branco  { background: #f0f0f0; border-color: #aaaaaa; }
.d-verde   { background: #22be5e; }
.d-azul    { background: #3a7fdb; }
.d-dourado { background: #d4a03a; }
.d-rosa    { background: #e87fa8; }
.d-laranja { background: #f07830; }
.d-roxo    { background: #8b5cf6; }

/* MODAL */
#mbg { position: fixed; inset: 0; background: rgba(4,4,10,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity .22s; }
#mbg.open { opacity: 1; pointer-events: all; }
#modal { background: #191921; border: 1px solid var(--border); border-radius: 22px; width: 100%; max-width: 800px; max-height: 93vh; overflow-y: auto; transform: translateY(26px) scale(.96); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
#mbg.open #modal { transform: none; }
#mtopbar { height: 4px; border-radius: 22px 22px 0 0; }
.br-realme   #mtopbar { background: var(--realme); }
.br-xiaomi   #mtopbar { background: var(--xiaomi); }
.br-motorola #mtopbar { background: var(--motorola); }
.br-itel     #mtopbar { background: var(--itel); }

.mhead { padding: 1.25rem 1.5rem .9rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--border); }
.mhead-left { display: flex; flex-direction: column; gap: .3rem; }
.mbadge { font-size: .6rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; padding: .24rem .62rem; border-radius: 4px; color: #000; width: fit-content; }
.mbadge.realme   { background: var(--realme); }
.mbadge.xiaomi   { background: var(--xiaomi); color: #fff; }
.mbadge.motorola { background: var(--motorola); color: #fff; }
.mbadge.itel     { background: var(--itel); }
#mtitle { font-family: 'Syne', sans-serif; font-size: 1.45rem; font-weight: 800; letter-spacing: -.025em; }
#mclose { background: rgba(255,255,255,.07); border: none; color: var(--sub); width: 34px; height: 34px; border-radius: 8px; font-size: .95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s, color .15s; }
#mclose:hover { background: rgba(255,255,255,.14); color: var(--text); }

/* MODAL BODY */
.mbody { display: grid; grid-template-columns: 220px 1fr; }
@media (max-width: 540px) { .mbody { grid-template-columns: 1fr; } }

/* MODAL IMAGE COLUMN */
.mimgcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 1.5rem 1rem 1.2rem; border-right: 1px solid var(--border); background: rgba(255,255,255,.015); gap: 1rem; }
@media (max-width: 540px) { .mimgcol { border-right: none; border-bottom: 1px solid var(--border); padding: 1.25rem; } }

/* MODAL SLIDER */
.mslider { width: 100%; display: flex; flex-direction: column; align-items: center; gap: .75rem; }
.mslide-track { position: relative; width: 100%; min-height: 220px; display: flex; align-items: center; justify-content: center; }
.mslide-img { max-height: 210px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 10px 30px rgba(0,0,0,.7)); position: absolute; opacity: 0; transition: opacity .4s ease; pointer-events: none; display: block; }
.mslide-img.active { opacity: 1; position: relative; pointer-events: auto; }
.mslide-nav { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; }
.msnav-btn { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.12); color: var(--sub); width: 30px; height: 30px; border-radius: 50%; font-size: .75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s; flex-shrink: 0; }
.msnav-btn:hover { background: rgba(255,255,255,.18); color: var(--text); }
.msdots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; min-height: 7px; }
.msdot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.18); cursor: pointer; transition: background .2s, transform .2s; border: none; padding: 0; }
.msdot.active { background: rgba(255,255,255,.75); transform: scale(1.2); }
.mfb { width: 80px; height: 130px; border-radius: 12px; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: var(--dim); }

.mimg-colors { display: flex; flex-direction: column; gap: .4rem; align-items: center; }
.mclabel-sm { font-size: .57rem; letter-spacing: .13em; text-transform: uppercase; color: var(--dim); }
.mimg-dots { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; }
.mdot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); position: relative; cursor: default; flex-shrink: 0; }
.mdot::after { content: attr(data-n); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #111; color: #fff; font-size: .6rem; padding: .18rem .4rem; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
.mdot:hover::after { opacity: 1; }

.minfocol { padding: 1.1rem 1.4rem 1.25rem; display: flex; flex-direction: column; gap: .9rem; }
.msec { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: .45rem; }
.mvariant-row { display: flex; gap: .4rem; flex-wrap: wrap; }
.mpill { font-size: .75rem; font-weight: 600; padding: .28rem .7rem; border-radius: 6px; background: rgba(255,255,255,.1); color: var(--text); }
.mspecs { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
@media (max-width: 380px) { .mspecs { grid-template-columns: 1fr; } }
.mspec { display: flex; align-items: flex-start; gap: .5rem; padding: .6rem .7rem; background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 10px; }
.mspec-icon { font-size: .95rem; flex-shrink: 0; margin-top: .05rem; }
.mspec-text { display: flex; flex-direction: column; gap: .08rem; }
.mspec-label { font-size: .57rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.mspec-val { font-size: .81rem; font-weight: 500; color: var(--text); line-height: 1.3; }
.mspec-sub { font-size: .71rem; color: var(--sub); }
.maddinfo { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; }
@media (max-width: 420px) { .maddinfo { grid-template-columns: 1fr 1fr; } }
.mchip { display: flex; flex-direction: column; gap: .1rem; padding: .48rem .6rem; background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 8px; }
.mchip-label { font-size: .54rem; letter-spacing: .11em; text-transform: uppercase; color: var(--dim); }
.mchip-val { font-size: .77rem; font-weight: 500; color: var(--sub); }

/* DESCRIPTION */
.mdesc-wrap { padding: 1.1rem 1.4rem 1.4rem; border-top: 1px solid var(--border); }
.mdesc-title { font-size: .6rem; letter-spacing: .15em; text-transform: uppercase; color: var(--dim); margin-bottom: .65rem; display: flex; align-items: center; gap: .5rem; }
.mdesc-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.mdesc-box { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.15rem; }
#mdesc { font-size: .83rem; line-height: 1.7; color: var(--sub); }

footer { text-align: center; color: var(--dim); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; margin-top: 2.5rem; }

/* WHATSAPP */
.mwa-wrap { padding: 0 1.4rem 1.5rem; border-top: 1px solid var(--border); padding-top: 1.1rem; }
.mwa-title { font-size: .6rem; letter-spacing: .15em; text-transform: uppercase; color: var(--dim); margin-bottom: .75rem; display: flex; align-items: center; gap: .5rem; }
.mwa-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.mwa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: .5rem; }
.mwa-btn { display: flex; align-items: center; gap: .55rem; padding: .6rem .85rem; border-radius: 10px; background: rgba(37,211,102,.1); border: 1px solid rgba(37,211,102,.25); text-decoration: none; color: #25d366; font-size: .78rem; font-weight: 600; transition: background .18s, border-color .18s, transform .15s; cursor: pointer; }
.mwa-btn:hover { background: rgba(37,211,102,.18); border-color: rgba(37,211,102,.5); transform: translateY(-1px); }
.mwa-btn:active { transform: translateY(0); }
.mwa-icon { flex-shrink: 0; width: 22px; height: 22px; }
.mwa-info { display: flex; flex-direction: column; gap: .05rem; min-width: 0; }
.mwa-store { font-size: .78rem; font-weight: 600; color: #25d366; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mwa-tap { font-size: .62rem; color: rgba(37,211,102,.6); }

/* ══ HERO BANNER ══ */
.hero-banner {
  display: block;
  padding: 8px 10px 12px;
  margin: 0;
  background: #0f0f13;
  line-height: 0;
}
.hero-logo-wrap {
  display: block;
  width: 100%;
  line-height: 0;
}
.hero-logo {
  width: 100%;
  height: auto;
  display: block;
}
@media (max-width: 600px) {
  .hero-logo { width: 100%; }
}

.brand-label.amazon { background: var(--amazon); color: #111; }
.amazon   .card::before { background: var(--amazon); }
.amazon   .card-stripe  { background: var(--amazon); }
.mbadge.amazon   { background: var(--amazon); color: #111; }
.br-amazon #mtopbar { background: var(--amazon); }

/* Color & glow overlay that shifts hue */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse 70% 60% at 20% 30%, rgba(0,180,255,.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 70%, rgba(180,0,255,.10) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(0,255,150,.06) 0%, transparent 50%);
  animation: overlay-shift 10s ease-in-out infinite alternate;
  pointer-events: none;
}

/* Scanlines effect */
#scanlines {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,.07) 3px,
    rgba(0,0,0,.07) 4px
  );
  pointer-events: none;
}

@keyframes bg-pan {
  0%   { background-position: 48% 48%; }
  25%  { background-position: 52% 45%; }
  50%  { background-position: 50% 53%; }
  75%  { background-position: 46% 50%; }
  100% { background-position: 52% 48%; }
}
  25%  { transform: scale(1.12) translate(-3%, -2%); }
  50%  { transform: scale(1.10) translate(2%, -3%); }
  75%  { transform: scale(1.13) translate(-2%, 2%); }
  100% { transform: scale(1.08) translate(3%, 1%); }
}

@keyframes bg-pulse {
  0%, 100% { filter: brightness(0.38) saturate(1.4) contrast(1.1); }
  50%       { filter: brightness(0.42) saturate(1.7) contrast(1.15) hue-rotate(15deg); }
}

@keyframes overlay-shift {
  0%   { opacity: 0.6; filter: hue-rotate(0deg); }
  33%  { opacity: 1.0; filter: hue-rotate(30deg); }
  66%  { opacity: 0.7; filter: hue-rotate(-20deg); }
  100% { opacity: 0.9; filter: hue-rotate(15deg); }
}


/* ══ CIRCUIT COMPONENT ANIMATIONS ══ */
#circuit-overlay {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  overflow: hidden;
}

/* ─ LED dots ─ */
.led { position: absolute; border-radius: 50%; animation: led-blink var(--d,1.8s) ease-in-out infinite var(--delay,0s); }
@keyframes led-blink {
  0%,100% { opacity: .15; box-shadow: 0 0 2px var(--c); transform: scale(1); }
  45%,55% { opacity: 1;   box-shadow: 0 0 8px 3px var(--c), 0 0 20px var(--c); transform: scale(1.35); }
}

/* ─ Data-stream lines ─ */
.stream-line {
  position: absolute;
  background: linear-gradient(90deg, transparent, var(--c,#00cfff), transparent);
  height: 1.5px;
  border-radius: 2px;
  animation: stream-flow var(--d,3s) linear infinite var(--delay,0s);
  opacity: 0;
}
@keyframes stream-flow {
  0%   { opacity: 0;   transform: translateX(-110%); }
  10%  { opacity: 0.9; }
  90%  { opacity: 0.9; }
  100% { opacity: 0;   transform: translateX(110%); }
}

/* ─ Vertical streams ─ */
.stream-vert {
  position: absolute;
  background: linear-gradient(180deg, transparent, var(--c,#00ff88), transparent);
  width: 1.5px;
  border-radius: 2px;
  animation: stream-vert-flow var(--d,4s) linear infinite var(--delay,0s);
  opacity: 0;
}
@keyframes stream-vert-flow {
  0%   { opacity: 0;   transform: translateY(-110%); }
  10%  { opacity: 0.8; }
  90%  { opacity: 0.8; }
  100% { opacity: 0;   transform: translateY(110%); }
}

/* ─ Chip glow ─ */
.chip-glow {
  position: absolute;
  border: 1px solid var(--c,#00cfff);
  border-radius: 4px;
  animation: chip-pulse var(--d,2.5s) ease-in-out infinite var(--delay,0s);
}
@keyframes chip-pulse {
  0%,100% { opacity: .08; box-shadow: inset 0 0 6px var(--c), 0 0 0 var(--c); }
  50%      { opacity: .45; box-shadow: inset 0 0 18px var(--c), 0 0 14px var(--c); }
}

/* ─ Scan beam ─ */
.scan-beam {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00cfff55, #00cfffcc, #00cfff55, transparent);
  animation: scan-sweep 8s ease-in-out infinite var(--delay,0s);
  opacity: 0;
}
@keyframes scan-sweep {
  0%        { top: -2px; opacity: 0; }
  5%        { opacity: .8; }
  95%       { opacity: .6; }
  100%      { top: 100%; opacity: 0; }
}

/* ─ Corner bracket flash ─ */
.bracket {
  position: absolute;
  width: 24px; height: 24px;
  animation: bracket-flash var(--d,3s) ease-in-out infinite var(--delay,0s);
  opacity: 0;
}
.bracket::before, .bracket::after { content:''; position:absolute; background: var(--c,#00cfff); }
.bracket.tl::before { top:0; left:0; width:100%; height:2px; }
.bracket.tl::after  { top:0; left:0; width:2px;  height:100%; }
.bracket.br::before { bottom:0; right:0; width:100%; height:2px; }
.bracket.br::after  { bottom:0; right:0; width:2px;  height:100%; }
@keyframes bracket-flash {
  0%,100% { opacity:0; }
  40%,60% { opacity:.7; }
}

/* ─ Pulse ring ─ */
.pulse-ring {
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid var(--c,#00cfff);
  animation: ring-expand var(--d,3s) ease-out infinite var(--delay,0s);
}
@keyframes ring-expand {
  0%   { transform: scale(0.4); opacity: .8; }
  100% { transform: scale(2.2); opacity: 0; }
}

/* ══ CATEGORY DIVIDERS ══ */
.cat-divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 0 0 2.5rem;
  padding: .6rem 1.2rem;
  border-radius: 14px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0.5rem;
  z-index: 100;
}
.cat-icon { font-size: 1.4rem; }
.cat-title {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text);
}
.cat-count {
  font-size: .72rem;
  font-weight: 600;
  padding: .22rem .65rem;
  border-radius: 20px;
  background: rgba(255,255,255,.12);
  color: var(--sub);
  letter-spacing: .06em;
}
.cat-line { flex: 1; height: 1px; background: rgba(255,255,255,.1); }

/* Make cards + cards grid slightly translucent to let bg shine */
.card {
  background: rgba(28,28,36,.82);
  backdrop-filter: blur(4px);
}
#modal { backdrop-filter: blur(20px); }


#catalog-root {
  padding: 0 1.5rem 2rem;
}
footer {
  padding: 0 1.5rem 4rem;
}

</style>
</head>

  const hdr = document.createElement('div');
  hdr.className = 'brand-header';
  hdr.innerHTML = `<span class="brand-label ${section.brand}">${section.label}</span><div class="brand-rule"></div>`;
  sec.appendChild(hdr);

  const grid = document.createElement('div');
  grid.className = 'cards';

  section.cards.forEach(cfg => {
    const p = DB[cfg.id];
    if (!p) return;
    grid.appendChild(buildCard(p, cfg, section.brand));
  });

  sec.appendChild(grid);
  root.appendChild(sec);
}

function buildCatalog() {
  const root = document.getElementById('catalog-root');

  CATALOG_PHONES.forEach(s => buildBrandSection(root, s));
  CATALOG_TABLETS.forEach(s => buildBrandSection(root, s));
}

function buildCard(p, cfg, brand) {
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => om(cfg.id, cfg.storage, cfg.ram, cfg.colors);

  // Image area with slider
  const imgDiv = document.createElement('div');
  imgDiv.className = 'card-img';

  const slider = document.createElement('div');
  slider.className = 'cslider';

  // Create slides
  const validImgs = [];
  p.imgs.forEach((url, i) => {
    const slide = document.createElement('div');
    slide.className = 'cslide' + (i === 0 ? ' active' : '');

    const img = document.createElement('img');
    img.src = url;
    img.alt = p.short;
    img.loading = 'lazy';
    img.onerror = function() {
      this.parentElement.style.display = 'none';
      rebuildDots(slider);
    };
    img.onload = function() {
      validImgs.push(i);
    };

    slide.appendChild(img);
    slider.appendChild(slide);
  });

  // Dots
  const dotsEl = document.createElement('div');
  dotsEl.className = 'csdots';
  p.imgs.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'csdot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', 'Foto ' + (i + 1));
    dot.addEventListener('click', e => {
      e.stopPropagation();
      showCardSlide(slider, i);
    });
    dotsEl.appendChild(dot);
  });

  // Stripe
  const stripe = document.createElement('div');
  stripe.className = 'card-stripe';

  slider.appendChild(dotsEl);
  slider.appendChild(stripe);
  imgDiv.appendChild(slider);

  // Info area
  const info = document.createElement('div');
  info.className = 'card-info';

  const model = document.createElement('div');
  model.className = 'card-model';
  model.textContent = p.short;

  const tags = document.createElement('div');
  tags.className = 'card-tags';
  tags.innerHTML = `<span class="ctag stor">${cfg.storage} GB</span><span class="ctag">${cfg.ram} GB</span>`;

  const colorDots = document.createElement('div');
  colorDots.className = 'card-dots';
  cfg.colors.forEach(c => {
    const d = document.createElement('span');
    d.className = 'dot d-' + c;
    colorDots.appendChild(d);
  });

  info.appendChild(model);
  info.appendChild(tags);
  info.appendChild(colorDots);

  card.appendChild(imgDiv);
  card.appendChild(info);

  return card;
}

function showCardSlide(slider, idx) {
  const slides = slider.querySelectorAll('.cslide');
  const dots   = slider.querySelectorAll('.csdot');
  const visible = Array.from(slides).filter(s => s.style.display !== 'none');
  if (visible.length === 0) return;

  const realIdx = Array.from(slides).indexOf(visible[idx % visible.length]);
  slides.forEach((s, i) => s.classList.toggle('active', i === realIdx));
  dots.forEach((d, i)   => d.classList.toggle('active',   i === realIdx));
  slider._cur = realIdx;
}

function rebuildDots(slider) {
  const slides = slider.querySelectorAll('.cslide');
  const dots   = slider.querySelectorAll('.csdot');
  const dotsEl = slider.querySelector('.csdots');
  const visible = Array.from(slides).filter(s => s.style.display !== 'none');

  if (visible.length <= 1) {
    dotsEl.style.display = 'none';
    return;
  }
  dotsEl.style.display = 'flex';

  // Re-render dots for visible slides only
  dotsEl.innerHTML = '';
  visible.forEach((slide, i) => {
    const dot = document.createElement('button');
    dot.className = 'csdot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', e => {
      e.stopPropagation();
      const idx = Array.from(slides).indexOf(slide);
      slides.forEach((s, si) => s.classList.toggle('active', si === idx));
      dotsEl.querySelectorAll('.csdot').forEach((d, di) => d.classList.toggle('active', di === i));
    });
    dotsEl.appendChild(dot);
  });
}

/* ─── CARD SLIDER AUTO-PLAY ─── */
function initCardSliders() {
  document.querySelectorAll('.cslider').forEach(slider => {
    const slides = slider.querySelectorAll('.cslide');
    if (slides.length <= 1) {
      const dotsEl = slider.querySelector('.csdots');
      if (dotsEl) dotsEl.style.display = 'none';
      return;
    }

    slider._cur = 0;
    let timer;

    function next() {
      const visible = Array.from(slides).filter(s => s.style.display !== 'none');
      if (visible.length <= 1) return;
      const curVis = visible.findIndex(s => s.classList.contains('active'));
      const nextVis = (curVis + 1) % visible.length;
      const allIdx = Array.from(slides).indexOf(visible[nextVis]);
      showCardSlide(slider, nextVis);
    }

    function startTimer() { timer = setInterval(next, 3800); }
    function stopTimer()  { clearInterval(timer); }

    const card = slider.closest('.card');
    if (card) {
      card.addEventListener('mouseenter', stopTimer);
      card.addEventListener('mouseleave', startTimer);
    }
    startTimer();
  });
}

/* ─── MODAL SLIDER ─── */
let mCur   = 0;
let mImgs  = [];
let mValid = [];

function initModalSlider(imgs) {
  mImgs  = imgs;
  mCur   = 0;
  mValid = [];

  const track = document.getElementById('mslide-track');
  const nav   = document.getElementById('mslide-nav');
  const dots  = document.getElementById('msdots');
  track.innerHTML = '';
  dots.innerHTML  = '';

  imgs.forEach((url, i) => {
    const img = document.createElement('img');
    img.className = 'mslide-img' + (i === 0 ? ' active' : '');
    img.alt = 'Foto ' + (i + 1);
    img.onload = function() {
      mValid.push(i);
      if (mValid.length > 1) {
        nav.style.display = 'flex';
        rebuildModalDots();
      }
    };
    img.onerror = function() {
      this.style.display = 'none';
    };
    img.src = url;
    track.appendChild(img);
  });

  nav.style.display = 'none';
  dots.innerHTML = '';
}

function rebuildModalDots() {
  const dots  = document.getElementById('msdots');
  const track = document.getElementById('mslide-track');
  const imgs  = track.querySelectorAll('.mslide-img');
  const valid = Array.from(imgs).filter(img => img.style.display !== 'none');

  dots.innerHTML = '';
  if (valid.length <= 1) return;

  valid.forEach((img, i) => {
    const dot = document.createElement('button');
    dot.className = 'msdot' + (img.classList.contains('active') ? ' active' : '');
    dot.addEventListener('click', () => {
      const realIdx = Array.from(imgs).indexOf(img);
      goModalTo(realIdx);
    });
    dots.appendChild(dot);
  });
}

function goModal(dir) {
  const track = document.getElementById('mslide-track');
  const imgs  = Array.from(track.querySelectorAll('.mslide-img'));
  const visible = imgs.filter(img => img.style.display !== 'none');
  if (visible.length <= 1) return;

  const curVis = visible.findIndex(img => img.classList.contains('active'));
  const nextVis = (curVis + dir + visible.length) % visible.length;
  const nextIdx = imgs.indexOf(visible[nextVis]);
  goModalTo(nextIdx);
}

function goModalTo(idx) {
  const track = document.getElementById('mslide-track');
  const imgs  = Array.from(track.querySelectorAll('.mslide-img'));
  const dots  = document.getElementById('msdots').querySelectorAll('.msdot');
  const visible = imgs.filter(img => img.style.display !== 'none');

  imgs.forEach(img => img.classList.remove('active'));
  imgs[idx].classList.add('active');

  const visIdx = visible.indexOf(imgs[idx]);
  dots.forEach((d, i) => d.classList.toggle('active', i === visIdx));
}

/* ─── OPEN MODAL ─── */

function cm() {

function bgck(e) {

document.addEventListener('keydown', e => { if (e.key === 'Escape') cm(); });

/* ─── INIT ─── */
buildCatalog();
// Wait a tick for DOM to render, then start sliders
requestAnimationFrame(() => {

    initCardSliders();
